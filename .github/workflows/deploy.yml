name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Website files are present and ready."
