name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 cp index.html s3://${{ secrets.S3_BUCKET }}/index.html --content-type "text/html"
          aws s3 cp style.css s3://${{ secrets.S3_BUCKET }}/style.css --content-type "text/css"
          aws s3 cp script.js s3://${{ secrets.S3_BUCKET }}/script.js --content-type "application/javascript"
