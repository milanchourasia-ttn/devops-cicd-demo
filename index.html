<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AWS-hosted DevOps CI/CD training website">
    <title>DevOps Training | CI/CD Pipeline</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">AWS Hosted Website</p>
      <h1>DevOps Training</h1>
      <p class="status"><span aria-hidden="true"></span> CI/CD Deployment Successful</p>
      <p class="version">Version: <strong id="version">1.0</strong></p>
      <p class="description">Deployed automatically using GitHub Actions</p>
      <div class="pipeline" aria-label="Deployment pipeline">
        <span>Push</span><b>→</b><span>Test</span><b>→</b><span>Build</span><b>→</b><span>Deploy</span>
      </div>
      <footer>Amazon S3 + CloudFront</footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
